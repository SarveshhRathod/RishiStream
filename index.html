<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StreamGod — Live Streaming</title>

    <!-- StreamGod Favicons (Native Browser Look) -->
    <link rel="icon" type="image/svg+xml" href="https://assetstitu.vercel.app/StreamGod/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="https://assetstitu.vercel.app/StreamGod/favicon-96x96.png">
    <link rel="shortcut icon" href="https://assetstitu.vercel.app/StreamGod/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="https://assetstitu.vercel.app/StreamGod/apple-touch-icon.png">
    <link rel="manifest" href="https://assetstitu.vercel.app/StreamGod/site.webmanifest">

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        /* 100% Seamless Fullscreen App iFrame */
        #appFrame {
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            background-color: #0b0f19;
        }

        /* Native Dark Preloader (No White Flash) */
        #preloader {
            position: fixed;
            inset: 0;
            background-color: #0b0f19;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(168, 85, 247, 0.15);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Smooth Native Loading Screen -->
    <div id="preloader">
        <img src="https://assetstitu.vercel.app/StreamGod/StreamGod.svg" alt="StreamGod" style="height: 48px; width: auto;">
        <div class="spinner"></div>
        <p style="color: #64748b; font-size: 11px; font-weight: 300; letter-spacing: 1.5px;">LOADING APP...</p>
    </div>

    <!-- Embedded Native Viewport iFrame -->
    <iframe 
        id="appFrame" 
        src="" 
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope; clipboard-write; microphone; camera" 
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
    </iframe>

    <script>
        // ========================================================
        // CONFIGURATION: Apne InfinityFree Domain ka URL Yahan Dalein
        // ========================================================
        const INFINITY_FREE_URL = "https://titu.ct.ws/stream/"; // <-- Replace with your actual InfinityFree domain

        function initApp() {
            const iframe = document.getElementById('appFrame');
            const preloader = document.getElementById('preloader');

            // URL Parameters Auto Forwarding (e.g., play.php?id=XYZ links ko automatically pass karega)
            const currentParams = window.location.search;
            const targetUrl = INFINITY_FREE_URL.replace(/\/$/, "") + (currentParams ? currentParams : "");

            iframe.src = targetUrl;

            // Hide preloader when app is loaded
            iframe.onload = function() {
                setTimeout(() => {
                    preloader.classList.add('hidden');
                }, 400);
            };

            // Max Timeout Fallback (5 seconds)
            setTimeout(() => {
                preloader.classList.add('hidden');
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
