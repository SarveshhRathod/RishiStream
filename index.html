<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV FANCODE — Match Board</title>

<!-- Satoshi Font -->
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0b0d;
  --card:#131519;
  --card-2:#1a1d22;
  --border:#26292f;
  --muted:#868b94;
  --text:#f5f6f8;
  --orange:#ff5a1f;
  --orange-deep:#e8380d;
  --orange-soft:rgba(255,90,31,.14);
  --orange-soft-border:rgba(255,90,31,.4);
  --live:#ff5a1f;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Satoshi', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
}
button, input{ font-family:inherit; }
img{ -webkit-user-drag:none; }

.app{ max-width:1360px; margin:0 auto; padding:0 20px 60px; }

header{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  padding:18px 4px;
  background:rgba(10,11,13,0.9);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  margin-bottom:26px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-logos{ display:flex; align-items:center; gap:10px; }
.brand-logos img{ height:32px; width:auto; display:block; object-fit:contain; }
.brand-divider{ width:1px; height:22px; background:var(--border); }
.last-update{ font-size:11px; color:var(--muted); letter-spacing:.4px; font-weight:500; }

.announcement-bar{
  background:var(--card);
  border:1px solid var(--orange-soft-border);
  color:var(--orange);
  padding:10px 16px;
  font-size:12px;
  font-weight:700;
  margin-bottom:20px;
  display:none;
}

.controls{ display:flex; justify-content:flex-end; margin-bottom:22px; }
.search-wrap{ position:relative; width:100%; max-width:340px; }
.search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none; }
.search-wrap input{
  width:100%; background:var(--card); border:1px solid var(--border);
  color:var(--text); font-size:13px; font-weight:500;
  padding:11px 14px 11px 38px; outline:none; transition:border-color .2s ease;
}
.search-wrap input:focus{ border-color:var(--orange); }

.grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; }

.loading-state, .empty-state{
  grid-column:1/-1; text-align:center; padding:60px 20px;
  color:var(--muted); font-size:13.5px; border:1px dashed var(--border);
}

.card{
  background:var(--card); border:1px solid var(--border);
  overflow:hidden; transition:border-color .2s ease;
  display:flex; flex-direction:column;
}
.card:hover{ border-color:var(--orange-soft-border); }

.thumb-wrap{
  position:relative; width:100%; height:180px; background:#000;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.thumb-wrap img{ width:100%; height:100%; object-fit:contain; display:block; }

.lang-badge{
  position:absolute; top:10px; left:10px;
  display:flex; align-items:center; gap:5px;
  background:rgba(0,0,0,.75); border:1px solid var(--orange);
  color:var(--orange); font-size:10px; font-weight:700; padding:5px 9px;
}

.status-badge{
  position:absolute; top:10px; right:10px;
  display:flex; align-items:center; gap:5px;
  background:rgba(0,0,0,.6); font-size:9.5px; font-weight:700;
  padding:4px 9px; color:var(--orange); border:1px solid var(--orange-soft-border);
}
.status-dot-mini{ width:5px; height:5px; border-radius:50%; background:currentColor; animation:miniPulse 1.8s infinite; }
@keyframes miniPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

.meta{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:9px; flex:1; text-align:center; }
.teams{ font-size:16px; font-weight:800; letter-spacing:.2px; text-transform:uppercase; line-height:1.28; }
.event{ font-size:12px; color:var(--muted); font-weight:500; }

.actions{ margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:4px; }
.btn{
  appearance:none; border:none; cursor:pointer; width:100%;
  font-weight:800; font-size:13px; letter-spacing:.5px; padding:12px 14px;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:background .2s ease;
}
.btn-watch-now{ background:var(--orange); color:#fff; text-decoration:none; }
.btn-watch-now:hover{ background:var(--orange-deep); }

.btn-ww{ background:transparent; color:var(--text); border:1px solid var(--border); }
.btn-ww:hover, .btn-ww.open{ border-color:var(--orange); color:var(--orange); }
.btn-ww .chev{ margin-left:auto; transition:transform .3s ease; }
.btn-ww.open .chev{ transform:rotate(180deg); }

.ww-panel-wrap{ display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .38s ease, opacity .3s ease; }
.ww-panel-wrap.open{ grid-template-rows:1fr; opacity:1; margin-top:1px; }
.ww-panel-inner{ overflow:hidden; display:flex; flex-direction:column; gap:6px; }
.ww-row{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:var(--card-2); border:1px solid var(--border); cursor:pointer; text-decoration:none; color:inherit;
}
.ww-row:hover{ background:var(--orange-soft); border-color:var(--orange-soft-border); color:var(--orange); }

footer{ margin-top:50px; padding-top:26px; border-top:1px solid var(--border); text-align:center; color:var(--muted); font-size:11px; font-weight:700; }
</style>
</head>

<body>

<div class="app">

  <!-- HEADER WITH TITU & EV LOGOS -->
  <header>
    <div class="brand">
      <div class="brand-logos">
        <img id="tituLogoImg" src="" alt="TITU Logo">
        <div class="brand-divider"></div>
        <img id="evLogoImg" src="" alt="EV Logo">
        <div class="brand-divider"></div>
        <img id="fancodeLogoImg" src="" alt="FanCode Logo">
      </div>
    </div>
    <div class="last-update" id="lastUpdate">LAST UPDATE: LOADING...</div>
  </header>

  <div id="announcementBar" class="announcement-bar">
    📢 <span id="announcementText"></span>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" onkeyup="filterMatches()" placeholder="SEARCH TEAM OR EVENT...">
    </div>
  </div>

  <div id="matchesGrid" class="grid">
    <div class="loading-state">LOADING LIVE MATCHES...</div>
  </div>

  <footer>
    CREDITS TO RISHI.EV & TITU | ALL RIGHTS RESERVED
  </footer>

</div>

<!-- Load Config First -->
<script src="config.js"></script>

<script>
let globalMatches = [];

document.addEventListener("DOMContentLoaded", () => {
  // Set Logos from config.js
  document.getElementById("tituLogoImg").src = CONFIG.TITU_LOGO;
  document.getElementById("evLogoImg").src = CONFIG.EV_LOGO;
  document.getElementById("fancodeLogoImg").src = CONFIG.FANCODE_LOGO;

  fetchMatches();
});

async function fetchMatches() {
  const grid = document.getElementById("matchesGrid");
  try {
    const res = await fetch(CONFIG.JSON_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("JSON Fetch Failed");
    
    const data = await res.json();
    globalMatches = data.Matches || [];

    if (data.last_updated) {
      document.getElementById("lastUpdate").textContent = "LAST UPDATE: " + data.last_updated.toUpperCase();
    }

    if (data.announcement) {
      document.getElementById("announcementText").textContent = data.announcement;
      document.getElementById("announcementBar").style.display = "flex";
    }

    renderGrid(globalMatches);
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="empty-state">COULD NOT LOAD STREAMS. CHECK CONFIG.JS JSON URL.</div>`;
  }
}

function renderGrid(matches) {
  const grid = document.getElementById("matchesGrid");
  if (!matches || matches.length === 0) {
    grid.innerHTML = `<div class="empty-state">NO MATCHES CURRENTLY AVAILABLE</div>`;
    return;
  }

  grid.innerHTML = matches.map(m => {
    const id = m.id || "";
    const name = m.event_name || "Live Event";
    const img = m.image || CONFIG.FALLBACK_IMG;
    const cnp = m.CnpTV || {};
    
    // Check Multi-Server availability
    const hasMultiple = cnp.cloudfront_server || cnp.akamai_server;

    // Secure payload encoding (Hides raw MPD URLs from plain HTML source)
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify({
      id: id,
      name: name,
      drm: m.drm_key || "",
      servers: cnp,
      logo: img
    }))));

    return `
      <article class="card card-item">
        <div class="thumb-wrap">
          <img src="${img}" alt="${name}" loading="lazy" onerror="this.src='${CONFIG.FALLBACK_IMG}'">
          <span class="lang-badge">ENGLISH</span>
          <span class="status-badge"><span class="status-dot-mini"></span>LIVE</span>
        </div>
        <div class="meta">
          <div class="teams">${name}</div>
          <div class="event">LIVE SPORTS EVENT</div>

          <div class="actions">
            <!-- Secure Link to play.html -->
            <button onclick="launchPlayer('${payload}', 'amazon_server')" class="btn btn-watch-now">
              WATCH NOW
            </button>

            ${hasMultiple ? `
              <button type="button" class="btn btn-ww" onclick="toggleAccordion('ww-${id}', this)">
                WORLD WIDE STREAM 
                <svg class="chev" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="ww-panel-wrap" id="ww-${id}">
                <div class="ww-panel-inner">
                  ${cnp.amazon_server ? `<div onclick="launchPlayer('${payload}', 'amazon_server')" class="ww-row"><span>🇺🇸</span><span style="flex:1;">Amazon Server (Main)</span></div>` : ''}
                  ${cnp.cloudfront_server ? `<div onclick="launchPlayer('${payload}', 'cloudfront_server')" class="ww-row"><span>⚡</span><span style="flex:1;">Cloudfront (Backup 1)</span></div>` : ''}
                  ${cnp.akamai_server ? `<div onclick="launchPlayer('${payload}', 'akamai_server')" class="ww-row"><span>🛡️</span><span style="flex:1;">Akamai (Backup 2)</span></div>` : ''}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      </article>
    `;
  }).join('');
}

// Store data safely in Session Storage to prevent URL tampering/scraping
function launchPlayer(payload, serverType) {
  sessionStorage.setItem("__EV_TITU_STREAM__", payload);
  sessionStorage.setItem("__EV_TITU_SERVER__", serverType);
  window.location.href = `play.html`;
}

function toggleAccordion(panelId, btn) {
  const panel = document.getElementById(panelId);
  if(panel) {
    panel.classList.toggle('open');
    btn.classList.toggle('open');
  }
}

function filterMatches() {
  const input = document.getElementById("searchInput").value.toUpperCase();
  const cards = document.getElementsByClassName("card-item");
  for (let i = 0; i < cards.length; i++) {
    const title = cards[i].querySelector(".teams").innerText;
    cards[i].style.display = title.toUpperCase().indexOf(input) > -1 ? "" : "none";
  }
}

// Anti-Extractable Security Script
document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = function(e) {
  if (e.keyCode == 123) return false; // F12
  if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
  if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
};
</script>

</body>
</html>
