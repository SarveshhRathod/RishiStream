<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV FANCODE — Live Match Board</title>

<!-- Satoshi Font -->
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #07080a;
  --card: #111318;
  --card-hover: #161a22;
  --card-2: #181c24;
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 90, 31, 0.45);
  --muted: #828894;
  --text: #f8fafc;
  --orange: #ff5a1f;
  --orange-deep: #e0440b;
  --orange-glow: rgba(255, 90, 31, 0.25);
  --orange-soft: rgba(255, 90, 31, 0.12);
  --orange-soft-border: rgba(255, 90, 31, 0.3);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Satoshi', sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  min-height: 100vh;
}
button, input { font-family: inherit; }
img { -webkit-user-drag: none; }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #1f2430; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--orange); }

.app { max-width: 1380px; margin: 0 auto; padding: 0 20px 60px; }

/* Perfectly Centered 3-Column Header */
header {
  position: sticky; top: 0; z-index: 50;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  background: rgba(7, 8, 10, 0.88);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  margin-bottom: 30px;
  border-radius: 0 0 16px 16px;
}

.header-left { display: flex; align-items: center; justify-content: flex-start; }
.header-center { display: flex; align-items: center; justify-content: center; }
.header-right { display: flex; align-items: center; justify-content: flex-end; }

/* Center Logos Container */
.brand-logos {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(255, 255, 255, 0.02);
  padding: 6px 18px;
  border-radius: 30px;
  border: 1px solid var(--border);
}

.brand-logos img {
  height: 30px;
  width: auto;
  display: block;
  object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
}

.brand-divider { width: 1px; height: 20px; background: var(--border); }

.header-status {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255, 90, 31, 0.08);
  border: 1px solid rgba(255, 90, 31, 0.2);
  padding: 6px 14px; border-radius: 20px;
  font-size: 11px; font-weight: 700; color: var(--orange); letter-spacing: 0.5px;
}
.header-pulse {
  width: 7px; height: 7px; background: var(--orange);
  border-radius: 50%; box-shadow: 0 0 10px var(--orange);
  animation: pulse 1.6s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(0.85); }
}

/* Centered Search Bar Section */
.controls-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 30px;
}

.search-wrap {
  position: relative;
  width: 100%;
  max-width: 460px;
}

.search-wrap svg {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  opacity: .4; pointer-events: none; transition: opacity 0.2s; color: var(--text);
}

.search-wrap input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px; font-weight: 600;
  padding: 13px 40px 13px 46px;
  outline: none;
  border-radius: 30px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.search-wrap input:focus {
  border-color: var(--orange);
  box-shadow: 0 0 20px var(--orange-glow);
  background: #141720;
}

.search-wrap input:focus + svg { opacity: 1; color: var(--orange); }

.search-clear {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  color: var(--muted); cursor: pointer; font-size: 14px; display: none;
}
.search-clear:hover { color: var(--text); }

/* Grid Layout & Alignment */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 22px;
  align-items: stretch;
}

.loading-state, .empty-state {
  grid-column: 1/-1; text-align: center; padding: 70px 20px;
  color: var(--muted); font-size: 14px; font-weight: 600;
  border: 1px dashed var(--border); border-radius: 16px;
  background: var(--card);
}

/* Card Alignment Improvements */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
}

.card:hover {
  border-color: var(--border-hover);
  transform: translateY(-6px);
  box-shadow: 0 12px 30px -10px var(--orange-glow);
  background: var(--card-hover);
}

.thumb-wrap {
  position: relative;
  width: 100%;
  height: 185px;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

.thumb-wrap img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover .thumb-wrap img { transform: scale(1.05); }

.lang-badge {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  display: flex; align-items: center; gap: 5px;
  background: rgba(7, 8, 10, 0.85);
  border: 1px solid rgba(255, 90, 31, 0.5);
  color: var(--orange); font-size: 10px; font-weight: 800;
  padding: 4px 10px; border-radius: 6px;
  backdrop-filter: blur(8px);
}

.status-badge {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  display: flex; align-items: center; gap: 6px;
  background: rgba(7, 8, 10, 0.85); font-size: 10px; font-weight: 800;
  padding: 4px 10px; color: var(--orange);
  border: 1px solid var(--orange-soft-border);
  border-radius: 6px; backdrop-filter: blur(8px);
}

.meta {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  justify-content: space-between;
  text-align: center;
}

.teams {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  line-height: 1.35;
  color: #fff;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.event { font-size: 12px; color: var(--muted); font-weight: 500; }

.actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

.btn {
  appearance: none; border: none; cursor: pointer; width: 100%;
  font-weight: 800; font-size: 13px; letter-spacing: 0.6px; padding: 12px 14px;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: all 0.25s ease;
}

.btn-watch-now {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-deep) 100%);
  color: #fff;
  box-shadow: 0 4px 15px var(--orange-glow);
}
.btn-watch-now:hover {
  filter: brightness(1.15);
  box-shadow: 0 6px 20px rgba(255, 90, 31, 0.45);
  transform: translateY(-1px);
}

.btn-ww {
  background: transparent; color: var(--text);
  border: 1px solid var(--border);
}
.btn-ww:hover, .btn-ww.open { border-color: var(--orange); color: var(--orange); background: var(--orange-soft); }
.btn-ww .chev { margin-left: auto; transition: transform 0.3s ease; }
.btn-ww.open .chev { transform: rotate(180deg); }

.ww-panel-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.35s ease, opacity 0.25s ease; }
.ww-panel-wrap.open { grid-template-rows: 1fr; opacity: 1; margin-top: 4px; }
.ww-panel-inner { overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
.ww-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--card-2); border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; text-decoration: none; color: inherit; transition: all 0.2s ease;
}
.ww-row:hover { background: var(--orange-soft); border-color: var(--orange-soft-border); color: var(--orange); }

footer {
  margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border);
  text-align: center; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
}

/* Mobile Responsive Alignment */
@media (max-width: 768px) {
  header {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  .header-left, .header-right { justify-content: center; }
  .brand-logos img { height: 26px; }
}
</style>
</head>

<body>

<div class="app">

  <!-- PERFECTLY CENTERED HEADER LOGOS -->
  <header>
    <div class="header-left">
      <div class="header-status">
        <span class="header-pulse"></span>
        <span id="lastUpdate">LIVE FEED</span>
      </div>
    </div>

    <!-- CENTERED LOGOS -->
    <div class="header-center">
      <div class="brand-logos">
        <img id="tituLogoImg" src="" alt="TITU Logo">
        <div class="brand-divider"></div>
        <img id="evLogoImg" src="" alt="EV Logo">
        <div class="brand-divider"></div>
        <img id="fancodeLogoImg" src="" alt="FanCode Logo">
      </div>
    </div>

    <div class="header-right">
      <span style="font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.5px;">OFFICIAL STREAMS</span>
    </div>
  </header>

  <!-- CENTERED SEARCH CONTROL -->
  <div class="controls-bar">

  <div id="matchesGrid" class="grid">

  <footer>
    CREDITS TO RISHI.EV & TITU | ALL RIGHTS RESERVED
  </footer>

</div>

<!-- External Config JS -->
<script src="config.js"></script>

<script>
let globalMatches = [];

document.addEventListener("DOMContentLoaded", () => {
  // Set Center Logos from config.js
  document.getElementById("tituLogoImg").src = CONFIG.TITU_LOGO;
  document.getElementById("evLogoImg").src = CONFIG.EV_LOGO;
  document.getElementById("fancodeLogoImg").src = CONFIG.FANCODE_LOGO;

  fetchJSONMatches();
});

// STRICTLY LOAD ONLY JSON MATCHES
async function fetchJSONMatches() {
  const grid = document.getElementById("matchesGrid");
  try {
    const res = await fetch(CONFIG.JSON_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("JSON Fetch Failed");
    
    const data = await res.json();
    globalMatches = data.Matches || [];

    if (data.last_updated) {
      document.getElementById("lastUpdate").textContent = "UPDATED: " + data.last_updated.toUpperCase();
    }

    renderMatchesOnly(globalMatches);
  } catch (err) {
    console.error("JSON Error:", err);
    grid.innerHTML = `<div class="empty-state">COULD NOT LOAD JSON STREAMS. CHECK CONFIG.JS URL.</div>`;
  }
}

    return;

      logo: img
    }))));

    return `

          <span class="lang-badge">ENGLISH</span>
          <span class="status-badge"><span class="header-pulse"></span>LIVE</span>
        </div>
        <div class="meta">
          <div>
            <div class="teams">${name}</div>
            <div class="event">LIVE EVENT STREAM</div>
          </div>

          <div class="a
